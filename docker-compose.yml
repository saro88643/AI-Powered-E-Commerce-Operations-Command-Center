version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: shopsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: shopsphere-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: shopsphere-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  external-apis:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.services
    container_name: shopsphere-external-apis
    restart: always
    ports:
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"
      - "4004:4004"
    environment:
      - PORT_INVENTORY=4001
      - PORT_DELIVERY=4002
      - PORT_PAYMENT=4003
      - PORT_CRM=4004

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    container_name: shopsphere-ai-service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - AI_SERVICE_PORT=5000
      - AI_PROVIDER=demo
      - BACKEND_URL=http://backend:3000
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: shopsphere-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/shopsphere
      - MONGODB_URI=mongodb://mongodb:27017/shopsphere
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=shopsphere-super-secret-jwt-key-for-dev-2026
      - AI_SERVICE_URL=http://ai-service:5000
      - INVENTORY_API_URL=http://external-apis:4001
      - DELIVERY_API_URL=http://external-apis:4002
      - PAYMENT_API_URL=http://external-apis:4003
      - CRM_API_URL=http://external-apis:4004
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      external-apis:
        condition: service_started
      ai-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: shopsphere-web
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
